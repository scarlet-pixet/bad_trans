map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 443 ssl;
    ssl_certificate /leaf/server.crt;
    ssl_certificate_key /leaf/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 ipv6=off valid=10s;
    proxy_ssl_trusted_certificate /trust/ca.crt;
    proxy_ssl_verify on;
    proxy_ssl_server_name on;
    proxy_ssl_protocols TLSv1.2 TLSv1.3;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    client_max_body_size 16m;

    location / {
        set $streamlit_backend frontend:8501;
        proxy_pass https://$streamlit_backend;
        proxy_ssl_name frontend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location = /graphql {
        set $gateway_backend gateway:8000;
        proxy_pass https://$gateway_backend;
        proxy_ssl_name gateway;
    }

    location /report-files/ {
        set $gateway_backend gateway:8000;
        proxy_pass https://$gateway_backend;
        proxy_ssl_name gateway;
        proxy_read_timeout 75s;
        proxy_buffering off;
    }
}
