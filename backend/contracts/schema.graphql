type Account {
  id: ID!
  clientId: ID!
  externalId: String!
  currency: String!
  status: String!
}

input AccountInput {
  clientId: ID!
  externalId: String!
  currency: String!
  idempotencyKey: String!
}

type AnalysisResult {
  id: ID!
  transactionId: ID!
  runId: ID!
  profileId: ID
  score: Int!
  threshold: Int!
  dataStatus: String!
  hits: [RuleHit!]!
  missingReasons: [String!]!
  calculatedAt: DateTime!
}

type AnalysisRun {
  id: ID!
  mode: String!
  status: String!
  counters: JSON!
  createdAt: DateTime!
  completedAt: DateTime
}

type AuthPayload {
  accessToken: String!
  expiresAt: DateTime!
  user: User!
}

type BehaviorProfile {
  id: ID!
  runId: ID!
  clientId: ID!
  currency: String!
  direction: Direction!
  windowStart: DateTime!
  windowEnd: DateTime!
  cutoffTransactionId: ID
  ingestedBefore: DateTime!
  sampleSize: Int!
  medianAmount: Decimal
  madAmount: Decimal
  metrics: JSON!
  dataStatus: String!
}

type CaseComment {
  id: ID!
  authorId: ID!
  kind: String!
  text: String!
  createdAt: DateTime!
}

input CaseCommentInput {
  caseId: ID!
  text: String!
  idempotencyKey: String!
}

type CaseDecision {
  id: ID!
  authorId: ID!
  reviewCycle: Int!
  outcome: CaseOutcome!
  reason: String!
  decidedAt: DateTime!
}

input CaseDecisionInput {
  caseId: ID!
  outcome: CaseOutcome!
  reason: String!
  expectedVersion: Int!
  idempotencyKey: String!
}

input CaseFilter {
  status: CaseStatus = null
  priority: Priority = null
  assigneeId: ID = null
  clientId: ID = null
  period: PeriodInput = null
}

enum CaseOutcome {
  UNUSUAL_CONFIRMED
  EXPLAINED
}

type CasePage {
  items: [ReviewCase!]!
  nextCursor: String
  totalCount: Int!
  currentCursor: String
}

enum CaseStatus {
  NEW
  ASSIGNED
  IN_PROGRESS
  ESCALATED
  CLOSED
}

type Client {
  id: ID!
  externalId: String!
  displayName: String!
  segment: String
  isActive: Boolean!
  accounts: [Account!]!
}

type ClientActivity {
  client: Client!
  currency: String!
  transactions: [Transaction!]!
  profiles: [BehaviorProfile!]!
  scoreDistribution: JSON!
  partialErrors: [String!]!
}

input ClientFilter {
  externalId: String = null
  segment: String = null
  isActive: Boolean = null
}

input ClientInput {
  externalId: String!
  displayName: String!
  segment: String = null
  idempotencyKey: String!
}

type ClientPage {
  items: [Client!]!
  nextCursor: String
  totalCount: Int!
  currentCursor: String
}

type Counterparty {
  id: ID!
  externalId: String!
  displayName: String!
  category: String
}

input CounterpartyInput {
  externalId: String!
  displayName: String!
  category: String = null
  idempotencyKey: String!
}

"""Date with time (isoformat)"""
scalar DateTime

"""Decimal (fixed-point)"""
scalar Decimal

enum Direction {
  IN
  OUT
}

input DistributionInput {
  limit: Int!
  idempotencyKey: String!
}

type DistributionResult {
  assignedCount: Int!
  unassignedCount: Int!
  assignments: JSON!
}

input ImportBatchInput {
  fileHash: String!
  items: [TransactionInput!]!
  idempotencyKey: String!
}

type ImportError {
  row: Int!
  code: String!
  message: String!
}

type ImportResult {
  batchId: ID!
  status: String!
  receivedCount: Int!
  newCount: Int!
  duplicateCount: Int!
  errors: [ImportError!]!
}

"""
The `JSON` scalar type represents JSON values as specified by [ECMA-404](https://ecma-international.org/wp-content/uploads/ECMA-404_2nd_edition_december_2017.pdf).
"""
scalar JSON @specifiedBy(url: "https://ecma-international.org/wp-content/uploads/ECMA-404_2nd_edition_december_2017.pdf")

enum LocationKind {
  POINT_OF_SALE
  ATM_DEVICE
  MERCHANT_REGISTRATION
}

type Mutation {
  createClient(input: ClientInput!): Client!
  openAccount(input: AccountInput!): Account!
  registerCounterparty(input: CounterpartyInput!): Counterparty!
  registerTransaction(input: TransactionInput!): Transaction!
  takeCase(caseId: ID!, expectedVersion: Int!, idempotencyKey: String!): ReviewCase!
  addCaseComment(input: CaseCommentInput!): ReviewCase!
  escalateCase(caseId: ID!, reason: String!, expectedVersion: Int!, idempotencyKey: String!): ReviewCase!
  closeCase(input: CaseDecisionInput!): ReviewCase!
  reopenCase(caseId: ID!, reason: String!, expectedVersion: Int!, idempotencyKey: String!): ReviewCase!
  markNotificationRead(id: ID!): Notification!
  signIn(login: String!, password: String!): AuthPayload!
  signOut: Boolean!
  registerStaff(input: StaffInput!): User!
  blockStaff(userId: ID!, idempotencyKey: String!): User!
  unblockStaff(userId: ID!, idempotencyKey: String!): User!
  changeStaffRole(userId: ID!, roleCode: RoleCode!, idempotencyKey: String!): User!
  declareSourceCoverage(input: SourceCoverageInput!): JSON!
  recordOperationEvent(input: OperationEventInput!): JSON!
  registerTransfer(input: RegisterTransferInput!): Transaction!
  changeFailureReview(owner: String!, id: ID!, action: String!, idempotencyKey: String!, reason: String = null): JSON!
  startPeriodReassessment(input: ReanalysisInput!): JSON!
  startBulkImport(fileBase64: String!, fileHash: String!, idempotencyKey: String!): JSON!
  startProfileRun(selection: JSON!, idempotencyKey: String!): JSON!
  createSnapshotReport(input: JSON!): JSON!
  startSource(idempotencyKey: String!, intervalSeconds: Float! = 1): JSON!
  setSourceState(runId: ID!, paused: Boolean!): JSON!
  importTransactions(input: ImportBatchInput!): ImportResult!
  buildProfile(input: ProfileInput!): AnalysisRun!
  analyzeTransaction(transactionId: ID!, idempotencyKey: String!): AnalysisRun!
  publishRuleVersion(input: RuleVersionInput!): RuleVersion!
  reanalyzePeriod(input: ReanalysisInput!): AnalysisRun!
  distributeCases(input: DistributionInput!): DistributionResult!
  createReport(input: ReportInput!): Report!
}

type Notification {
  id: ID!
  caseId: ID
  type: String!
  createdAt: DateTime!
  readAt: DateTime
}

type NotificationPage {
  items: [Notification!]!
  nextCursor: String
  totalCount: Int!
  currentCursor: String
}

input OperationEventInput {
  source: String!
  operationRef: String!
  eventRef: String!
  kind: String!
  channel: String!
  status: String!
  accountId: ID!
  currency: String!
  direction: String!
  amount: Decimal!
  occurredAt: DateTime!
  counterpartyId: ID = null
  originalTransactionId: ID = null
  transfer: OperationTransferInput = null
  timePrecision: String = null
  location: OperationLocationInput = null
}

input OperationLocationInput {
  kind: LocationKind!
  countryCode: String!
  city: String = null
  placeRef: String = null
}

type OperationProcessing {
  state: OperationProcessingState!
  resultId: ID
}

enum OperationProcessingState {
  PENDING
  SCORED
  PARTIAL
  UNAVAILABLE
  FAILED
  UNKNOWN
}

input OperationTransferInput {
  transferNamespace: String!
  transferRef: String!
  debit: TransferPartyInput!
  credit: TransferPartyInput!
}

input PageInput {
  limit: Int! = 20
  cursor: String = null
  sortBy: String = null
  sortDirection: String = null
}

input PeriodInput {
  from: DateTime!
  to: DateTime!
}

enum Priority {
  LOW
  MEDIUM
  HIGH
}

input ProfileInput {
  clientId: ID!
  currency: String!
  direction: Direction!
  cutoff: DateTime!
  idempotencyKey: String!
}

type Query {
  me: User!
  clients(filter: ClientFilter = null, page: PageInput = null): ClientPage!
  transactions(filter: TransactionFilter = null, page: PageInput = null): TransactionPage!
  transaction(id: ID!): Transaction
  clientActivity(clientId: ID!, period: PeriodInput!, currency: String!, runId: ID!): ClientActivity!
  profile(id: ID!): BehaviorProfile
  analysisResult(id: ID!): AnalysisResult
  analysisRun(id: ID!): AnalysisRun
  compareRuns(firstId: ID!, secondId: ID!): RunComparison!
  ruleVersions(ruleId: ID!): [RuleVersion!]!
  reviewCases(filter: CaseFilter = null, page: PageInput = null): CasePage!
  reviewCase(id: ID!): ReviewCase
  report(id: ID!): Report
  exportReport(id: ID!): ReportExport!
  notifications(unreadOnly: Boolean = null, page: PageInput = null): NotificationPage!
  transactionSummary(filter: TransactionFilter = null): TransactionSummaryResult!
  failureReviews(owner: String!, state: String! = "ACTIVE", offset: Int! = 0): JSON!
  failureReview(owner: String!, id: ID!): JSON!
  bulkImport(id: ID!): JSON!
  bulkImports(offset: Int! = 0): JSON!
  bulkImportErrors(id: ID!): String!
  kafkaLag: JSON!
  clientLabels(ids: [ID!]!): JSON!
  notificationById(id: ID!): JSON
  ruleCatalog: JSON!
  periodRunResults(runId: ID!, offset: Int! = 0, limit: Int! = 100): JSON
  comparePeriodRuns(firstId: ID!, secondId: ID!, offset: Int! = 0, limit: Int! = 50): JSON!
  compareProfileRuns(firstId: ID!, secondId: ID!, offset: Int! = 0, limit: Int! = 20): JSON!
  profileRun(id: ID!, offset: Int! = 0, limit: Int! = 50): JSON!
  profileRuns(limit: Int! = 20, offset: Int! = 0): JSON!
  exportSnapshotReport(id: ID!, format: String!, table: String = null): JSON!
  snapshotReport(id: ID!): JSON!
  snapshotReports(limit: Int! = 20, offset: Int! = 0): JSON!
  profileVersion(id: ID!): JSON!
  compareProfileVersions(firstId: ID!, secondId: ID!): JSON!
  operationLifecycle(transactionId: ID!): JSON
  clientSpending(clientId: ID!, currencyCode: String!, period: PeriodInput!): JSON!
  operationTransfer(transactionId: ID!): JSON
  operationProcessing(transactionId: ID!): OperationProcessing!
  resultHistory(transactionId: ID!, limit: Int! = 20, pageToken: String = null): JSON!
  feedbackStatus: JSON!
  behaviorProfilePage(clientId: ID = null, windowDays: Int! = 30, history: Boolean! = false, currency: String = null, direction: String = null, origin: String = null, limit: Int! = 50, pageToken: String = null): JSON!
  profileRefreshStatus: JSON!
  counterparties: JSON!
  staffUsers: JSON!
  behaviorProfiles(clientId: ID = null, windowDays: Int! = 30, history: Boolean! = false): JSON!
  detections(clientId: ID = null): JSON!
  detectionContext(transactionId: ID!, resultId: ID = null): JSON
  sources: JSON!
  qualityReport(runId: ID!): JSON!
  caseContext(caseId: ID!): JSON!
  managerDashboard: JSON!
}

input ReanalysisInput {
  period: PeriodInput!
  clientId: ID = null
  ruleVersionIds: [ID!]!
  idempotencyKey: String!
}

input RegisterTransferInput {
  transaction: TransactionInput!
  transferNamespace: String!
  transferRef: String!
  debit: TransferPartyInput!
  credit: TransferPartyInput!
}

type Report {
  id: ID!
  periodStart: DateTime!
  periodEnd: DateTime!
  filters: JSON!
  snapshot: JSON!
  createdAt: DateTime!
}

type ReportExport {
  fileName: String!
  mediaType: String!
  contentBase64: String!
}

input ReportInput {
  period: PeriodInput!
  outcome: CaseOutcome = null
  assigneeId: ID = null
  idempotencyKey: String!
}

type ReviewCase {
  id: ID!
  transactionId: ID!
  clientId: ID!
  latestResultId: ID!
  latestScore: Int!
  status: CaseStatus!
  priority: Priority!
  assigneeId: ID
  reviewCycle: Int!
  rowVersion: Int!
  comments: [CaseComment!]!
  decisions: [CaseDecision!]!
}

enum RoleCode {
  ADMIN
  ANALYST
  MANAGER
}

type RuleHit {
  ruleCode: String!
  version: Int!
  featureValue: JSON!
  limitValue: JSON!
  contribution: Int!
}

type RuleVersion {
  id: ID!
  ruleId: ID!
  version: Int!
  weight: Int!
  parameters: JSON!
  status: String!
  publishedAt: DateTime
}

input RuleVersionInput {
  ruleId: ID!
  version: Int!
  parameters: JSON!
  weight: Int!
  controlExamples: JSON!
  idempotencyKey: String!
}

type RunComparison {
  commonCount: Int!
  onlyFirstCount: Int!
  onlySecondCount: Int!
  changedScores: JSON!
  newHits: JSON!
}

input SourceCoverageInput {
  accountId: ID!
  source: String!
  channel: String!
  direction: String!
  feature: String!
  revision: String!
  intervals: [PeriodInput!]!
}

input StaffInput {
  login: String!
  password: String!
  roleCode: RoleCode!
  idempotencyKey: String!
}

type Transaction {
  id: ID!
  externalId: String!
  source: String!
  clientId: ID!
  accountId: ID!
  counterpartyId: ID
  amount: Decimal!
  currency: String!
  direction: Direction!
  occurredAt: DateTime!
  ingestedAt: DateTime!
  timePrecision: String
}

input TransactionFilter {
  clientId: ID = null
  period: PeriodInput = null
  currency: String = null
  amountFrom: Decimal = null
  amountTo: Decimal = null
  direction: Direction = null
}

input TransactionInput {
  source: String!
  externalId: String!
  accountId: ID!
  counterpartyId: ID = null
  amount: Decimal!
  currency: String!
  direction: Direction!
  occurredAt: DateTime!
  idempotencyKey: String!
  timePrecision: String = null
}

type TransactionPage {
  items: [Transaction!]!
  nextCursor: String
  totalCount: Int!
  currentCursor: String
}

type TransactionSummaryResult {
  transactionCount: Int!
  totalAmount: Decimal!
  averageAmount: Decimal
  minimumAmount: Decimal
  maximumAmount: Decimal
  incomingCount: Int!
  outgoingCount: Int!
}

input TransferPartyInput {
  accountId: ID = null
  externalAccountId: String = null
  externalNamespace: String = null
}

type User {
  id: ID!
  login: String!
  role: RoleCode!
  isActive: Boolean!
}
